{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>設定</h2>
  <form method="post">
    <h3>凍結防止の上限</h3>
    <label>1日の応募数の上限 <input type="number" name="daily_entry_limit" value="{{ s.daily_entry_limit }}" min="1"></label>
    <label>1日のフォロー数の上限 <input type="number" name="daily_follow_limit" value="{{ s.daily_follow_limit }}" min="1"></label>
    <label>フォロー総数の警告ライン <input type="number" name="total_follow_warning" value="{{ s.total_follow_warning }}" min="1"></label>

    <h3>検索条件（1行に1つ）</h3>
    <p class="note">X の検索演算子が使えます。例：<code>filter:verified</code>（認証済みのみ）、<code>-filter:replies</code>（返信を除く）</p>
    <textarea name="search_queries" rows="5">{{ s.search_queries }}</textarea>

    <h3>公式アカウント（ホワイトリスト）</h3>
    <p class="note">@なしのIDを1行に1つ。安全チェックで「公式」と表示され、フォロー整理の対象から外れます。</p>
    <textarea name="whitelist" rows="5">{{ whitelist }}</textarea>

    <h3>ブラックリスト</h3>
    <textarea name="blacklist" rows="3">{{ blacklist }}</textarea>

    <button class="btn" type="submit">保存</button>
  </form>
</section>
{% endblock %}
