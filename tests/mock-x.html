<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mock X</title>
<style>
body{font-family:sans-serif;margin:0;padding:8px;background:#fff}
article{border-bottom:1px solid #ddd;padding:8px}
[role=menu]{position:fixed;left:20px;right:20px;top:30%;background:#fff;border:1px solid #888;padding:8px;z-index:50}
[role=menuitem],[role=menu] a{display:block;padding:8px}
#composer{position:fixed;inset:0;background:#fff;z-index:60;padding:20px}
</style></head>
<body>
<!--
  X（x.com）の画面を模したテスト用ページ。tests/userscript.e2e.cjs から http で開く。
  data-testid は X の実画面と同じ名前を使っている（実画面の変更で動かなくなる可能性がある）。
  ・本文中の @リンクを押すとプロフィール画面に切り替わる（X と同じく画面遷移でツイートの表示は作り直される）
-->
<div data-testid="primaryColumn" id="col"></div>
<script>
const tweets = [
  { id: "111", handle: "FENNEL_official", name: "FENNEL", verified: true,
    text: "FENNEL HOTELAVA\nTHANK YOU GIVEAWAY\n\n感謝の気持ちを込めて、以下の2点をセットで抽選で2名様にプレゼント\n\n【応募方法】\n① 本ポストをリポスト\n② @hotelloversjp、@FENNEL_official をフォロー\n\n【応募期限】\n11/20（金）23:59まで" },
  { id: "222", handle: "akiko_lawson", name: "ローソン", verified: true,
    text: "盛りすぎ！チャレンジキャンペーン♪\n\n① @akiko_lawson をフォロー✨\n② この投稿に「ローソン盛りすぎチャレンジ」とコメントを付けて引用ポスト\n③ 抽選で1名様にQUOカードPay1万円分が当たる🎁" },
  { id: "333", handle: "toshiba_life", name: "東芝", verified: true,
    text: "📢ご応募は　東芝ライフスタイル公式 Instagramから！\n\n新発売の単機能レンジ\n「WarM(ウォーム)」\nプレゼントキャンペーン開催!" },
  { id: "444", handle: "img_brand", name: "画像ブランド", verified: true,
    text: "冬のプレゼントキャンペーン🎁\n詳しい応募方法は画像をチェック！" },
  { id: "555", handle: "someone", name: "一般人", verified: false, text: "今日のランチはカレー" },
];
const st = {};                 // ツイートごとの いいね・リポスト状態
const following = new Set();  // フォロー中
const log = [];
const col = document.getElementById("col");

function textHtml(t) {
  return t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))
    .replace(/@([A-Za-z0-9_]{1,15})/g, '<a href="/$1" class="mention">@$1</a>').replace(/\n/g, "<br>");
}
function renderTimeline() {
  col.innerHTML = "";
  for (const t of tweets) {
    const s = st[t.id] || (st[t.id] = {});
    const a = document.createElement("article");
    a.setAttribute("data-testid", "tweet");
    a.innerHTML = `
      <div data-testid="User-Name"><a href="/${t.handle}"><span>${t.name}</span>${t.verified ? '<svg data-testid="icon-verified"></svg>' : ""}</a>
        <a href="/${t.handle}">@${t.handle}</a> <a href="/${t.handle}/status/${t.id}"><time>1時間</time></a></div>
      <button data-testid="caret">…</button>
      <div data-testid="tweetText" lang="ja">${textHtml(t.text)}</div>
      <div role="group"><button data-testid="reply">💬</button>
        <button data-testid="${s.rt ? "unretweet" : "retweet"}">🔁</button><button data-testid="${s.like ? "unlike" : "like"}">♡</button></div>`;
    // 本物のXはツイート全体のクリックで詳細へ移動（いいね等のボタン・リンクは除く）
    a.addEventListener("click", (e) => { if (!e.target.closest("button[data-testid], a")) log.push("navigate:" + t.id); });
    col.appendChild(a);
  }
}
function renderProfile(handle) {
  col.innerHTML = `<div><h2>@${handle}</h2>
    <button data-testid="9${handle.length}-${following.has(handle.toLowerCase()) ? "unfollow" : "follow"}" id="pf">フォロー</button></div>
    <div data-testid="UserCell"><button data-testid="77-follow">おすすめユーザーをフォロー</button></div>`;
  col.querySelector("#pf").addEventListener("click", (e) => {
    if (e.target.dataset.testid.endsWith("-follow")) {
      following.add(handle.toLowerCase()); log.push("follow:" + handle);
      setTimeout(() => { e.target.dataset.testid = e.target.dataset.testid.replace(/-follow$/, "-unfollow"); }, 200);
    }
  });
  col.querySelector('[data-testid="UserCell"] button').addEventListener("click", () => log.push("WRONG-follow"));
}
function route() {
  const m = /^\/([A-Za-z0-9_]{1,15})$/.exec(location.pathname);
  if (m && m[1] !== "mock-x") renderProfile(m[1]); else renderTimeline();
}
window.addEventListener("popstate", () => setTimeout(route, 150));
document.addEventListener("click", (e) => {
  const link = e.target.closest("a.mention");
  if (link) { e.preventDefault(); history.pushState(null, "", link.getAttribute("href")); setTimeout(route, 150); }
});

function closeMenus() { document.querySelectorAll('[role="menu"]').forEach((m) => m.remove()); }
function openMenu(html) { closeMenus(); const m = document.createElement("div"); m.setAttribute("role", "menu"); m.innerHTML = html; document.body.appendChild(m); return m; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenus(); });
col.addEventListener("click", (e) => {
  const btn = e.target.closest("article button[data-testid]");
  if (!btn) return;
  e.stopPropagation();
  const art = btn.closest("article");
  const handle = art.querySelector('[data-testid="User-Name"] a').getAttribute("href").slice(1);
  const id = [...art.querySelectorAll("a")].find((x) => x.querySelector("time")).getAttribute("href").split("/").pop();
  const tid = btn.dataset.testid;
  if (tid === "like") { btn.dataset.testid = "unlike"; st[id].like = true; log.push("like:" + id); }
  if (tid === "retweet" || tid === "unretweet") {
    const m = openMenu(`${tid === "retweet" ? '<div role="menuitem" data-testid="retweetConfirm">リポスト</div>' : '<div role="menuitem" data-testid="unretweetConfirm">リポストを取り消す</div>'}
      <a href="/compose/post" role="menuitem">引用</a>`);
    m.querySelector('[data-testid="retweetConfirm"]')?.addEventListener("click", () => { btn.dataset.testid = "unretweet"; st[id].rt = true; log.push("repost:" + id); closeMenus(); });
    m.querySelector("a").addEventListener("click", (ev) => {
      ev.preventDefault(); closeMenus();
      const c = document.createElement("div"); c.id = "composer";
      c.innerHTML = '<div data-testid="tweetTextarea_0" contenteditable="true" style="min-height:80px;border:1px solid #ccc"></div><button data-testid="tweetButton">ポストする</button>';
      document.body.appendChild(c);
      c.querySelector('[data-testid="tweetButton"]').addEventListener("click", () => {
        log.push("quote:" + id + ":" + c.querySelector('[data-testid="tweetTextarea_0"]').innerText); c.remove();
      });
    });
  }
  if (tid === "caret") {
    const f = following.has(handle.toLowerCase());
    const m = openMenu(`<div role="menuitem">@${handle}さんをミュート</div><div role="menuitem">@${handle}さんをリストに追加/削除</div>
      <div role="menuitem" class="fol">${f ? `@${handle}さんのフォローを解除` : `@${handle}さんをフォロー`}</div>`);
    m.querySelector(".fol").addEventListener("click", () => { if (!f) { following.add(handle.toLowerCase()); log.push("follow:" + handle); } closeMenus(); });
  }
});
window.__log = log;
route();
</script>
</body>
</html>
